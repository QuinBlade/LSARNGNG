name: Build LSARNG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --preset release

      - name: Build
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --build build/release

      - name: Package MO2 override
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $pluginDir = Join-Path $package "SKSE\Plugins"
          $dll = Join-Path $env:GITHUB_WORKSPACE "build\release\LSARNG.dll"

          if (!(Test-Path $dll)) {
              throw "Build output was not found: $dll"
          }

          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item -Force $dll (Join-Path $pluginDir "LSARNG.dll")

          # Make a real mod archive for the GitHub Release. Archive the
          # contents of package so SKSE is at the ZIP root.
          $archive = Join-Path $env:GITHUB_WORKSPACE "LSARNG-1.7.104-Override.zip"
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $archive -Force

          Write-Host "Prepared MO2 package directory: $package"
          Write-Host "Created release archive: $archive"
          Get-ChildItem -Recurse $package | Select-Object FullName, Length

      - name: Upload MO2 package
        uses: actions/upload-artifact@v4
        with:
          name: LSARNG-1.7.104-Override
          # GitHub downloads this artifact as a ZIP with SKSE at its root,
          # so the downloaded artifact can be installed directly by MO2.
          path: package

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ github.workspace }}\LSARNG-1.7.104-Override.zip" `
            --title "LSARNG ${{ github.ref_name }}" `
            --generate-notes
